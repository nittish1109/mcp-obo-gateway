name: Build and Deploy MCP Gateway

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ca2861c11171acr

      - name: Build and Push Docker Image
        run: |
          docker build -t ca2861c11171acr.azurecr.io/mcp-obo-gateway:latest .
          docker push ca2861c11171acr.azurecr.io/mcp-obo-gateway:latest
